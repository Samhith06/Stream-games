<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Live Session · StreamArena</title>
<link href="/tailwind.css" rel="stylesheet"/>
<script src="/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  .input-dark { background:rgb(var(--surface-container-lowest)); border:1px solid rgb(var(--outline-variant)); color:rgb(var(--on-surface)); }
  .input-dark:focus { border-color:rgb(var(--tertiary)); box-shadow:0 0 0 1px rgb(var(--tertiary)); outline:none; }
  .glass { background:rgb(var(--surface-container)/.6); backdrop-filter:blur(12px); border:1px solid rgb(var(--outline-variant)); }
  @keyframes flashIn { 0% { opacity:0; transform:scale(.96) } 100% { opacity:1; transform:none } }
  .flash-card { animation: flashIn .25s cubic-bezier(.16,1,.3,1); }
  /* Glow-only pulse: the colour must stay put, or "critical" reads as a fade. */
  @keyframes pulseRed { 0%,100% { text-shadow:0 0 8px rgb(var(--loss)/.5) } 50% { text-shadow:0 0 22px rgb(var(--loss)/.95) } }
  .critical { color: rgb(var(--loss)); animation: pulseRed 1s infinite; }
</style>
</head>
<body class="bg-background text-on-surface font-body-md antialiased flex">
<main class="flex-1 ml-64 min-h-screen pb-32">
  <div class="p-lg max-w-[1600px] mx-auto" id="root">
    <div class="text-on-surface-variant font-data-mono py-xl text-center">Connecting…</div>
  </div>
</main>

<!-- Sticky phase-advance bar -->
<div id="actionbar" class="hidden fixed bottom-0 left-64 right-0 glass border-t border-outline-variant p-md
     flex justify-between items-center z-40"></div>

<!-- Confirm dialog -->
<div id="dialog" class="hidden fixed inset-0 bg-background/80 backdrop-blur-sm z-50 items-center justify-center p-md"></div>

<script type="module">
import { api, control, connect, attempt, toast, money, signed, multiplier, countdown, copy, $, escapeHtml, slotTile, requireSessionId } from './app.js'
import { mountShell } from './shell.js'

const sessionId = requireSessionId()
const me = await mountShell({ active: '/session' })
if (!me) throw new Error('unauthorized')

const detail = await api(`/api/sessions/${sessionId}`)
const gameId = detail.gameId
setGameTheme(gameId)
const currency = detail.config.currency ?? 'EUR'
let state = detail.state ?? {}
// Held in a variable rather than written straight to the DOM: onStatus can fire
// before the first render, and every re-render rebuilds the header.
let connection = 'connecting'

// The dashboard socket carries the fuller projection — unresolved queue, raw
// pool, per-viewer detail — that the overlay never sees (§19).
/** The four states an entry moves through (§21): badge, dot, label. */
const STATUS_BADGE = {
  pending: ['bg-surface-variant text-on-surface-variant border-outline-variant', 'bg-outline', 'Matching…'],
  queued: ['bg-surface-variant text-on-surface-variant border-outline-variant', 'bg-outline', 'Pending'],
  collected: ['bg-primary/20 text-primary border-primary/30', 'bg-primary', 'Collected'],
  opened: ['bg-win/15 text-win border-win/30', 'bg-win', 'Opened'],
}

const socket = connect({
  url: `${location.origin.replace(/^http/, 'ws')}/ws/session/${sessionId}`,
  onState: (next) => { state = next; draw() },
  onCue: showCue,
  onStatus: (status) => {
    connection = status
    paintConnection()
    if (status === 'ended') setTimeout(() => (location.href = '/history'), 2500)
  },
})

draw()
setInterval(() => { const el = $('#timer'); if (el) tickTimer(el) }, 250)

// ─── render ─────────────────────────────────────────────────────────────────

function draw() {
  $('#root').innerHTML = gameId === 'bonus-hunt' ? hunt() : tournament()
  drawActionBar()
  wire()
  paintConnection()
}

function paintConnection() {
  const dot = $('#conn')
  const label = $('#conn-label')
  if (!dot || !label) return

  const [colour, text] = {
    connected: ['bg-win live-dot', 'Synced'],
    ended: ['bg-outline', 'Ended'],
    reconnecting: ['bg-tertiary live-dot', 'Reconnecting…'],
  }[connection] ?? ['bg-error', 'Connecting…']

  dot.className = `w-2 h-2 rounded-full ${colour}`
  label.textContent = text
}

function statTile(label, value, opts = {}) {
  // A whole class, not a colour name: Tailwind's build-time scanner reads
  // source text, so an interpolated `text-${x}` would compile to nothing.
  const accent = opts.accent ?? 'text-on-surface'
  return `
  <div class="bg-surface-container p-md rounded-xl border ${opts.border ?? 'border-outline-variant'} flex flex-col justify-center">
    <span class="text-on-surface-variant font-label-caps text-label-caps uppercase mb-xs flex items-center gap-xs">
      ${opts.icon ? `<span class="material-symbols-outlined text-[16px]">${opts.icon}</span>` : ''}${escapeHtml(label)}
    </span>
    <span class="font-data-mono text-[22px] ${accent}">${value}</span>
    ${opts.sub ? `<span class="text-[12px] text-on-surface-variant mt-1">${opts.sub}</span>` : ''}
  </div>`
}

function header(phases, current) {
  return `
  <header class="flex flex-wrap justify-between items-center gap-md mb-lg">
    <div class="flex items-center gap-lg">
      <div class="flex items-center gap-xs">
        <span id="conn" class="w-2 h-2 rounded-full bg-error"></span>
        <span id="conn-label" class="font-data-mono text-[12px] text-on-surface-variant">Connecting…</span>
        <span class="sr-only" aria-live="polite"></span>
      </div>
      <div class="hidden lg:flex items-center gap-xs">
        ${phases.map((p, i) => `
          <div class="flex items-center font-label-caps text-label-caps uppercase tracking-wider
                      ${p === current ? 'text-primary' : 'text-on-surface-variant opacity-50'}">
            <span class="w-6 h-6 rounded-full ${p === current ? 'bg-primary text-on-primary' : 'border border-outline-variant'}
                         flex items-center justify-center mr-2">${i + 1}</span>${p}
          </div>
          ${i < phases.length - 1 ? '<div class="w-8 h-px bg-outline-variant mx-sm"></div>' : ''}`).join('')}
      </div>
    </div>
    <div class="flex items-center gap-sm">
      <button data-copy="${escapeHtml(detail.overlayUrl)}"
        class="border border-secondary text-secondary hover:bg-secondary/10 px-md py-xs rounded-lg font-data-mono text-[13px]
               flex items-center gap-xs transition-colors">
        <span class="material-symbols-outlined text-[16px]">content_copy</span> Copy overlay URL
      </button>
      <button data-end
        class="border border-error text-error hover:bg-error/10 px-md py-xs rounded-lg font-data-mono text-[13px] transition-colors">
        End session
      </button>
    </div>
  </header>`
}

// ─── Bonus Hunt ─────────────────────────────────────────────────────────────

function hunt() {
  const phase = state.phase ?? 'collecting'
  const phases = ['Collecting', 'Guessing', 'Opening', 'Results']
  const current = { collecting: 'Collecting', guessing: 'Guessing', opening: 'Opening', complete: 'Results' }[phase]

  const banked = state.collectedCount ?? 0
  const target = state.targetBonuses ?? 0
  const profit = state.profit ?? 0

  return `
  ${header(phases, current)}

  <div class="grid grid-cols-2 md:grid-cols-4 gap-sm mb-lg">
    ${statTile('Starting balance', money(state.startBalance, currency))}
    ${statTile('Bonuses banked', `${banked}<span class="text-on-surface-variant text-[14px]"> / ${target}</span>`,
      { accent: 'text-primary', border: 'border-primary/30', sub: `${state.suggestionCount ?? 0} suggested` })}
    ${statTile('Break-even average', breakEven(),
      { accent: 'text-tertiary', border: 'border-tertiary/50', icon: 'stars',
        sub: 'per remaining bonus' })}
    ${statTile('Participants', String(state.participantCount ?? 0), { icon: 'group' })}
  </div>

  ${phase === 'guessing' ? guessingHero() : ''}
  ${phase === 'opening' || phase === 'complete' ? openingStats(profit) : ''}
  ${phase === 'complete' ? resultHero(profit) : ''}

  <div class="grid grid-cols-1 xl:grid-cols-3 gap-lg">
    <div class="xl:col-span-2 flex flex-col gap-lg">
      ${unresolved()}
      ${entryTable(phase)}
    </div>
    <div class="flex flex-col gap-lg">
      ${phase === 'collecting' ? manualAdd() : ''}
      ${guessPanel(phase)}
    </div>
  </div>`
}

function unresolved() {
  const items = state.unresolved ?? []
  if (items.length === 0) return ''

  // §20 — the most valuable component in the dashboard. Keyboard shortcuts
  // because it gets worked in bursts.
  return `
  <div class="bg-surface-container-high rounded-xl border border-tertiary/60 p-md">
    <div class="flex justify-between items-center mb-md">
      <h3 class="font-body-lg font-bold text-tertiary flex items-center gap-sm">
        <span class="material-symbols-outlined">warning</span>
        ${items.length} request${items.length === 1 ? '' : 's'} we couldn't match
      </h3>
      <span class="font-data-mono text-[11px] text-on-surface-variant">1/2/3 pick · D discard</span>
    </div>
    <div class="flex gap-sm overflow-x-auto pb-xs">
      ${items.map((item, index) => `
        <div class="bg-surface-container p-sm rounded-lg min-w-[260px] border ${index === 0 ? 'border-tertiary' : 'border-outline-variant'} flex flex-col gap-xs"
             data-unresolved="${escapeHtml(item.entryId)}">
          <span class="font-data-mono text-on-surface">"${escapeHtml(item.rawText)}"</span>
          <span class="text-sm text-on-surface-variant">by ${escapeHtml(item.requestedBy.username)}</span>
          <div class="flex flex-col gap-1 mt-xs">
            ${(item.suggestions ?? []).slice(0, 3).map((s, i) => `
              <button data-resolve="${escapeHtml(item.entryId)}" data-slot="${escapeHtml(s.slotId)}"
                      data-raw="${escapeHtml(item.rawText)}"
                class="text-left bg-surface-variant hover:bg-primary hover:text-on-primary px-2 py-1 rounded text-xs
                       font-bold transition-colors flex justify-between">
                <span>${i + 1}. ${escapeHtml(s.name)}</span>
                <span class="opacity-60">${Math.round((s.confidence ?? 0) * 100)}%</span>
              </button>`).join('') || '<span class="text-[11px] text-on-surface-variant/60">No suggestions</span>'}
            <div class="flex gap-1 mt-1">
              <input data-custom="${escapeHtml(item.entryId)}" placeholder="Type a slot name…"
                     class="input-dark flex-1 rounded px-2 py-1 text-xs font-data-mono">
              <button data-discard="${escapeHtml(item.entryId)}"
                class="bg-surface-variant hover:bg-error hover:text-on-error px-2 py-1 rounded text-xs font-bold transition-colors">D</button>
            </div>
          </div>
        </div>`).join('')}
    </div>
  </div>`
}

function entryTable(phase) {
  const entries = state.entries ?? []

  return `
  <div class="bg-surface-container rounded-xl border border-outline-variant flex-1 overflow-hidden flex flex-col">
    <div class="p-md border-b border-outline-variant flex justify-between items-center bg-surface-container-high">
      <h2 class="font-headline-md text-headline-md font-bold">
        ${phase === 'opening' || phase === 'complete' ? 'Opening' : 'Slots'}
      </h2>
      <span class="font-data-mono text-[12px] text-on-surface-variant">${entries.length} entries</span>
    </div>
    <div class="overflow-y-auto max-h-[540px]">
      ${entries.length === 0
        ? `<div class="p-xl text-center text-on-surface-variant">
             <span class="material-symbols-outlined text-[40px] opacity-40">casino</span>
             <p class="mt-sm">No slots yet. Viewers add them with <span class="font-data-mono text-primary">!sr &lt;slot&gt;</span></p>
           </div>`
        : `<table class="w-full text-left border-collapse">
            <thead class="sticky top-0 bg-surface-container-high z-10 border-b border-outline-variant">
              <tr class="font-label-caps text-label-caps uppercase text-on-surface-variant">
                <th class="p-sm">Slot</th><th class="p-sm">By</th><th class="p-sm w-28">Bet</th>
                ${phase === 'opening' || phase === 'complete' ? '<th class="p-sm w-32">Win</th><th class="p-sm w-20 text-right">Mult</th>' : ''}
                <th class="p-sm">Status</th><th class="p-sm text-right">Actions</th>
              </tr>
            </thead>
            <tbody class="font-data-mono text-sm divide-y divide-outline-variant/40">
              ${entries.map((e) => entryRow(e, phase)).join('')}
            </tbody>
          </table>`}
    </div>
  </div>`
}

function entryRow(e, phase) {
  const [badge, dot, text] = STATUS_BADGE[e.status] ?? STATUS_BADGE.queued
  const opening = phase === 'opening' || phase === 'complete'
  const done = phase === 'complete'

  return `
  <tr class="hover:bg-surface-container-high transition-colors group ${e.status === 'opened' ? 'opacity-70' : ''}">
    <td class="p-sm">
      <div class="flex items-center gap-sm">
        ${slotTile(e.slotName, e.thumbnail, 'w-10 h-10 rounded object-cover border border-outline-variant/40 text-[13px]')}
        <div>
          <div class="font-bold text-on-surface">${escapeHtml(e.slotName)}</div>
          ${e.provider ? `<div class="text-[11px] text-on-surface-variant">${escapeHtml(e.provider)}</div>` : ''}
        </div>
      </div>
    </td>
    <td class="p-sm text-on-surface-variant">${escapeHtml(e.requestedBy)}</td>
    <td class="p-sm">
      <input data-bet="${escapeHtml(e.id)}" type="number" step="0.01" value="${e.bet ?? 0}" ${done ? 'disabled' : ''}
             class="input-dark w-24 rounded px-2 py-1 text-sm font-data-mono">
    </td>
    ${opening ? `
      <td class="p-sm">
        <input data-win="${escapeHtml(e.id)}" type="number" step="0.01" placeholder="—"
               value="${e.win ?? ''}" ${done ? 'disabled' : ''}
               class="input-dark w-28 rounded px-2 py-1 text-sm font-data-mono ${e.status === 'opened' ? 'text-win' : ''}">
      </td>
      <td class="p-sm text-right ${e.multiplier >= 100 ? 'text-tertiary font-bold' : 'text-on-surface-variant'}">
        ${multiplier(e.multiplier)}
      </td>` : ''}
    <td class="p-sm">
      <span class="inline-flex items-center gap-1 ${badge} px-2 py-1 rounded-full text-xs font-bold border">
        <span class="w-2 h-2 rounded-full ${dot}"></span> ${text}
      </span>
    </td>
    <td class="p-sm text-right">
      <div class="flex items-center justify-end gap-xs">
        ${e.status === 'queued'
          ? `<button data-collect="${escapeHtml(e.id)}"
               class="bg-primary/20 text-primary border border-primary/50 hover:bg-primary hover:text-on-primary
                      px-2 py-1 rounded text-xs font-bold transition-colors whitespace-nowrap">Mark collected</button>`
          : e.status === 'collected'
            ? `<button data-uncollect="${escapeHtml(e.id)}" title="Put it back in the queue"
                 class="text-on-surface-variant hover:text-tertiary transition-colors">
                 <span class="material-symbols-outlined text-[18px]">undo</span></button>`
            : ''}
        ${!done ? `<button data-remove="${escapeHtml(e.id)}" title="Remove"
             class="text-on-surface-variant hover:text-error transition-colors">
             <span class="material-symbols-outlined text-[18px]">close</span></button>` : ''}
      </div>
    </td>
  </tr>`
}

function manualAdd() {
  return `
  <div class="bg-surface-container rounded-xl border border-outline-variant p-md">
    <h3 class="font-body-lg font-bold mb-md flex items-center gap-sm">
      <span class="material-symbols-outlined text-primary">add_box</span> Add a slot yourself
    </h3>
    <div class="relative">
      <input id="slot-search" placeholder="Search the catalog…" autocomplete="off"
             class="input-dark w-full rounded px-md py-sm font-data-mono">
      <div id="slot-results" class="hidden absolute z-30 left-0 right-0 mt-1 bg-surface-container-high
           border border-outline-variant rounded-lg shadow-2xl max-h-64 overflow-y-auto"></div>
    </div>
    <p class="text-[11px] text-on-surface-variant/70 mt-xs">
      Nothing matching? Press Enter to add it as a custom slot — the catalog never blocks a hunt.
    </p>
  </div>`
}

function guessingHero() {
  return `
  <section class="glass rounded-xl p-lg mb-lg flex flex-col items-center relative overflow-hidden">
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-primary-container
                rounded-full opacity-10 blur-3xl pointer-events-none"></div>
    <h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest mb-sm">Guessing closes in</h2>
    <div id="timer" data-ends="${state.guessWindowEndsAt ?? ''}"
         class="font-display-lg text-[72px] font-bold text-primary leading-none mb-lg tabular">—</div>
    <div class="flex gap-md z-10">
      <button data-extend
        class="border border-secondary text-secondary hover:bg-secondary/10 px-6 py-3 rounded-full font-data-mono
               transition-colors flex items-center gap-2">
        <span class="material-symbols-outlined text-[18px]">timer</span> Extend 1 min
      </button>
      <button data-lock
        class="bg-primary text-on-primary hover:brightness-110 px-8 py-3 rounded-full font-data-mono font-bold
               shadow-[0_0_15px_rgb(var(--primary)/.4)] transition-all flex items-center gap-2">
        <span class="material-symbols-outlined text-[18px]">lock</span> Lock guesses &amp; start opening
      </button>
    </div>
  </section>`
}

function openingStats(profit) {
  const best = state.bestEntry
  return `
  <div class="grid grid-cols-2 md:grid-cols-4 gap-sm mb-lg">
    ${statTile('Total won', money(state.won, currency), { accent: 'text-primary' })}
    ${statTile('Best win', best ? money(best.win, currency) : '—',
      { accent: 'text-tertiary', border: 'border-tertiary/50', icon: 'stars',
        sub: best ? `${escapeHtml(best.slotName)} · ${multiplier(best.multiplier)}` : '' })}
    ${statTile('To break even', money(state.toBreakEven, currency))}
    ${statTile('Profit / loss', signed(profit, currency), { accent: profit >= 0 ? 'text-win' : 'text-error' })}
  </div>`
}

function resultHero(profit) {
  const w = state.winner
  return `
  <section class="flex flex-col items-center justify-center py-xl mb-lg">
    <h2 class="font-label-caps ${profit >= 0 ? 'text-win' : 'text-error'} tracking-widest mb-sm uppercase">
      ${profit >= 0 ? 'Profit' : 'Loss'}
    </h2>
    <div class="text-[72px] font-display-lg ${profit >= 0 ? 'text-win' : 'text-error'} leading-none mb-md tabular">
      ${signed(profit, currency)}
    </div>
    <div class="font-data-mono text-body-lg text-on-surface-variant bg-surface-container px-lg py-xs rounded-full border border-outline-variant">
      ${money(state.startBalance, currency)}
      <span class="material-symbols-outlined align-middle mx-xs text-outline text-[18px]">arrow_forward</span>
      ${money(state.finalBalance, currency)}
    </div>
    ${w ? `
      <div class="mt-lg bg-surface-container border border-primary rounded-xl p-lg text-center
                  shadow-[0_0_20px_rgb(var(--primary)/.2)]">
        <div class="font-label-caps text-primary tracking-widest mb-sm">GUESS THE BALANCE WINNER</div>
        <div class="font-display-lg-mobile text-display-lg-mobile">@${escapeHtml(w.username)}</div>
        <div class="font-data-mono text-on-surface-variant mt-xs">
          guessed ${money(w.amount, currency)} · off by ${money(w.difference, currency)}
        </div>
      </div>` : ''}
    <div class="flex gap-sm mt-lg">
      <a href="/api/sessions/${sessionId}/export.csv"
         class="border border-outline-variant hover:border-primary px-md py-sm rounded-lg font-data-mono text-sm flex items-center gap-xs">
        <span class="material-symbols-outlined text-[18px]">download</span> Export CSV
      </a>
      <a href="/games" class="bg-primary text-on-primary font-bold px-md py-sm rounded-lg flex items-center gap-xs">
        <span class="material-symbols-outlined text-[18px]">replay</span> Run another
      </a>
    </div>
  </section>`
}

function guessPanel(phase) {
  if (phase === 'collecting') return ''

  // §20 — the five guesses closest to the running total. The streamer's
  // narration fuel for the whole opening phase.
  const closest = state.closestGuesses ?? []
  const recent = state.recentGuesses ?? []
  const dist = state.guessDistribution ?? {}
  const showClosest = phase === 'opening' || phase === 'complete'

  return `
  <div class="bg-surface-container rounded-xl border border-outline-variant flex flex-col overflow-hidden">
    <div class="p-md border-b border-outline-variant flex justify-between items-center">
      <h3 class="font-body-lg font-bold flex items-center gap-xs">
        <span class="material-symbols-outlined text-secondary">monitoring</span>
        ${showClosest ? 'Closest guesses' : 'Live guesses'}
      </h3>
      <span class="font-data-mono text-[12px] text-on-surface-variant">${state.guessCount ?? 0} total</span>
    </div>

    ${showClosest ? `
      <div class="flex flex-col gap-xs p-sm">
        ${closest.length === 0 ? '<p class="text-on-surface-variant text-sm p-sm">Nobody guessed.</p>'
          : closest.map((g, i) => `
          <div class="flex items-center justify-between p-sm rounded border
                      ${i === 0 ? 'bg-surface-container-highest border-secondary/40' : 'bg-surface-container-low border-outline-variant/40'}">
            <div class="flex items-center gap-sm">
              <span class="font-data-mono ${i === 0 ? 'text-secondary font-bold' : 'text-on-surface-variant'}">${i + 1}.</span>
              <span class="font-data-mono text-on-surface">${escapeHtml(g.username)}</span>
            </div>
            <div class="text-right">
              <div class="font-data-mono ${i === 0 ? 'text-secondary' : 'text-on-surface'}">${money(g.amount, currency)}</div>
              <div class="font-data-mono text-[11px] text-on-surface-variant">off by ${money(g.difference, currency)}</div>
            </div>
          </div>`).join('')}
      </div>`
    : `
      <div class="p-md border-b border-outline-variant grid grid-cols-3 gap-sm text-center">
        <div><span class="block font-label-caps text-[10px] text-on-surface-variant">Lowest</span>
          <span class="font-data-mono text-sm">${dist.lowest != null ? money(dist.lowest, currency) : '—'}</span></div>
        <div><span class="block font-label-caps text-[10px] text-on-surface-variant">Median</span>
          <span class="font-data-mono text-sm">${dist.median != null ? money(dist.median, currency) : '—'}</span></div>
        <div><span class="block font-label-caps text-[10px] text-on-surface-variant">Highest</span>
          <span class="font-data-mono text-sm">${dist.highest != null ? money(dist.highest, currency) : '—'}</span></div>
      </div>
      <div class="flex-1 overflow-y-auto max-h-72 p-sm flex flex-col gap-1">
        ${recent.length === 0 ? '<p class="text-on-surface-variant text-sm p-sm">Waiting for guesses…</p>'
          : recent.map((g) => `
          <div class="flex items-center justify-between p-2 rounded bg-surface-container-low border border-outline-variant/30">
            <div class="flex items-center gap-xs">
              <span class="text-sm">${escapeHtml(g.username)}</span>
              ${g.edited ? '<span class="text-[10px] text-on-surface-variant/60">(edited)</span>' : ''}
            </div>
            <span class="font-data-mono text-sm text-primary">${money(g.amount, currency)}</span>
          </div>`).join('')}
      </div>`}
  </div>`
}

  const phases = ['Joining', 'Draw', 'Voting', 'Playing', 'Results']

// ─── action bar ─────────────────────────────────────────────────────────────

function drawActionBar() {
  const bar = $('#actionbar')
  const phase = state.phase
  let html = ''

  if (gameId === 'bonus-hunt' && phase === 'collecting') {
    const banked = state.collectedCount ?? 0
    html = `
      <div class="text-on-surface-variant font-data-mono text-sm">
        ${banked} bonus${banked === 1 ? '' : 'es'} banked. Close entries when you're done collecting.
      </div>
      <button data-close class="bg-primary text-on-primary px-xl py-sm rounded-lg font-bold uppercase
        font-label-caps flex items-center gap-sm hover:brightness-110 transition-all">
        Close entries &amp; ${state.guessEnabled === false ? 'start opening' : 'open guessing'}
        <span class="material-symbols-outlined">arrow_forward</span>
      </button>`
  } else if (gameId === 'bonus-hunt' && phase === 'opening') {
    const left = state.remainingBonuses ?? 0
    html = `
      <div class="text-on-surface-variant font-data-mono text-sm">
        ${left} bonus${left === 1 ? '' : 'es'} left to open. The hunt finishes automatically on the last one.
      </div>
      <button data-finish ${left > 0 ? 'disabled' : ''}
        class="bg-primary text-on-primary px-xl py-sm rounded-lg font-bold uppercase font-label-caps
               disabled:opacity-40 disabled:cursor-not-allowed">Finish hunt</button>`
  } else if (gameId === 'slot-tournament' && phase === 'joining') {
    html = `
      <div class="text-on-surface-variant font-data-mono text-sm">
        ${state.poolCount ?? 0} joined. Close joining when you're ready to draw.
      </div>
      <button data-closejoin class="bg-primary text-on-primary px-xl py-sm rounded-lg font-bold uppercase font-label-caps">
        Close joining &amp; run draw</button>`
  }

  bar.innerHTML = html
  bar.classList.toggle('hidden', html === '')
  bar.classList.toggle('flex', html !== '')
}

// ─── timers ─────────────────────────────────────────────────────────────────

function tickTimer(el) {
  const ends = Number(el.dataset.ends)
  if (!ends) return
  const text = countdown(ends)
  el.textContent = text ?? '00:00'
  el.classList.toggle('critical', ends - Date.now() < 30_000)
}

// ─── cues ───────────────────────────────────────────────────────────────────

function showCue(kind, payload) {
  if (kind === 'inputError') return toast(payload, 'error')

  if (kind === 'flash' && payload.slotName) {
    toast(`${payload.slotName} paid ${money(payload.win, currency)} · ${multiplier(payload.multiplier)}`, 'success')
  }
  if (kind === 'matchResult') {
    const winner = payload.winner === 'a' ? payload.a : payload.b
    toast(`@${winner.username} advances · ${multiplier(winner.multiplier)} (${payload.decidedBy})`, 'success')
  }
}

// ─── wiring ─────────────────────────────────────────────────────────────────

function wire() {
  const on = (sel, event, fn) => document.querySelectorAll(sel).forEach((el) => el.addEventListener(event, fn))
  const act = (action, payload) => attempt(() => control(sessionId, action, payload))

  on('[data-copy]', 'click', (e) => copy(e.currentTarget.dataset.copy, 'Overlay URL copied'))

  on('[data-end]', 'click', () =>
    confirmDialog('End this session?', 'The Kick subscription is released and the game closes.', async () => {
      await attempt(() => api(`/api/sessions/${sessionId}/end`, { method: 'POST', body: { reason: 'abandoned' } }))
    }))

  // Entry actions
  on('[data-collect]', 'click', (e) => collectDialog(e.currentTarget.dataset.collect))
  on('[data-uncollect]', 'click', (e) => act('entry.uncollect', { entryId: e.currentTarget.dataset.uncollect }))
  on('[data-remove]', 'click', (e) => act('entry.remove', { entryId: e.currentTarget.dataset.remove }))

  on('[data-bet]', 'change', (e) =>
    act('entry.setBet', { entryId: e.currentTarget.dataset.bet, bet: Number(e.currentTarget.value) }))
  on('[data-win]', 'change', (e) =>
    act('entry.setWin', { entryId: e.currentTarget.dataset.win, win: e.currentTarget.value === '' ? null : Number(e.currentTarget.value) }))

  // Unresolved queue
  on('[data-resolve]', 'click', (e) => {
    const { resolve, slot, raw } = e.currentTarget.dataset
    attempt(() => api(`/api/sessions/${sessionId}/resolve`, {
      method: 'POST', body: { entryId: resolve, slotId: slot, rawText: raw },
    }), { success: 'Matched' })
  })
  on('[data-discard]', 'click', (e) =>
    attempt(() => api(`/api/sessions/${sessionId}/resolve`, {
      method: 'POST', body: { entryId: e.currentTarget.dataset.discard, action: 'discard' },
    })))
  on('[data-custom]', 'keydown', (e) => {
    if (e.key !== 'Enter' || !e.currentTarget.value.trim()) return
    attempt(() => api(`/api/sessions/${sessionId}/resolve`, {
      method: 'POST', body: { entryId: e.currentTarget.dataset.custom, customName: e.currentTarget.value.trim() },
    }), { success: 'Added as a custom slot' })
  })

  // Phase advance
  on('[data-close]', 'click', () => closeCollection())
  on('[data-lock]', 'click', () => act('guesses.lock'))
  on('[data-extend]', 'click', () => act('guesses.extend', { ms: 60_000 }))
  on('[data-finish]', 'click', () => act('hunt.complete'))

  // Tournament
  on('[data-closejoin]', 'click', () => act('join.close'))
  on('[data-draw]', 'click', () =>
    confirmDialog('Run the draw?', 'This runs once and cannot be re-rolled.', () => act('draw.run')))
  on('[data-reserve]', 'click', (e) => act('reserve.add', { userId: e.currentTarget.dataset.reserve }))
  on('[data-startvote]', 'click', () => act('match.startVoting'))
  on('[data-lockvote]', 'click', () => act('match.lockVoting'))
  on('[data-revert]', 'click', (e) => act('match.revert', { matchId: e.currentTarget.dataset.revert }))
  on('[data-advance]', 'click', () => act('match.startVoting'))
  on('[data-result]', 'click', () => {
    const num = (sel) => Number(document.querySelector(sel)?.value ?? 0)
    act('match.result', {
      aBuyCost: num('[data-cost="a"]'), aPayout: num('[data-payout="a"]'),
      bBuyCost: num('[data-cost="b"]'), bPayout: num('[data-payout="b"]'),
    })
  })

  // Live multiplier as the streamer types (§16.4).
  for (const key of ['a', 'b']) {
    const recompute = () => {
      const cost = Number(document.querySelector(`[data-cost="${key}"]`)?.value)
      const payout = Number(document.querySelector(`[data-payout="${key}"]`)?.value)
      const out = document.querySelector(`[data-mult="${key}"]`)
      if (out) out.textContent = cost > 0 ? multiplier(payout / cost) : '—'
    }
    document.querySelector(`[data-cost="${key}"]`)?.addEventListener('input', recompute)
    document.querySelector(`[data-payout="${key}"]`)?.addEventListener('input', recompute)
  }

  slotSearch()
}

async function closeCollection() {
  const banked = state.collectedCount ?? 0
  if (banked === 0 && !confirm('No bonuses banked yet. Close anyway?')) return

  // §13 — spent is captured once, here, because it's the moment the streamer
  // would naturally look at their balance.
  confirmDialog(
    'Close entries',
    `<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase mb-xs">What's your balance now?</label>
     <input id="balance-now" type="number" step="0.01" autofocus
            class="input-dark w-full rounded px-md py-sm font-data-mono text-[20px]">
     <p class="text-[12px] text-on-surface-variant mt-xs">
       We use this to work out what the hunt cost — ${banked} bonus${banked === 1 ? '' : 'es'} banked.
     </p>`,
    async () => {
      const value = Number(document.getElementById('balance-now').value)
      if (!Number.isFinite(value)) return toast('Enter your current balance', 'error')
      await attempt(() => control(sessionId, 'collection.close', { balanceNow: value }))
    },
    { html: true },
  )
}

function slotSearch() {
  const input = $('#slot-search')
  const results = $('#slot-results')
  if (!input) return

  let timer
  input.addEventListener('input', () => {
    clearTimeout(timer)
    timer = setTimeout(async () => {
      const q = input.value.trim()
      if (q.length < 2) return results.classList.add('hidden')

      const { slots } = await api(`/api/catalog/slots?q=${encodeURIComponent(q)}&limit=8`)
      results.innerHTML = slots.length === 0
        ? `<div class="p-sm text-on-surface-variant text-sm">No match — press Enter to add "${escapeHtml(q)}" as custom.</div>`
        : slots.map((s) => `
          <button data-pick='${escapeHtml(JSON.stringify({ slotId: s.slotId, slotName: s.name, provider: s.provider, thumbnail: s.thumbnail }))}'
            class="w-full text-left px-sm py-2 hover:bg-primary hover:text-on-primary transition-colors flex justify-between">
            <span>${escapeHtml(s.name)}</span>
            <span class="text-[11px] opacity-60">${escapeHtml(s.provider ?? '')}</span>
          </button>`).join('')
      results.classList.remove('hidden')

      results.querySelectorAll('[data-pick]').forEach((btn) =>
        btn.addEventListener('click', async () => {
          const slot = JSON.parse(btn.dataset.pick)
          await attempt(() => control(sessionId, 'entry.add', { ...slot, rawText: slot.slotName }),
            { success: `${slot.slotName} added` })
          input.value = ''
          results.classList.add('hidden')
        }))
    }, 200)
  })

  input.addEventListener('keydown', async (e) => {
    if (e.key !== 'Enter') return
    e.preventDefault()
    const name = input.value.trim()
    if (!name) return
    const { slot } = await attempt(() => api('/api/catalog/slots/custom', { method: 'POST', body: { name } }))
    await attempt(() => control(sessionId, 'entry.add',
      { slotId: slot.slotId, slotName: slot.name, rawText: name }), { success: `${slot.name} added` })
    input.value = ''
    results.classList.add('hidden')
  })
}

// ─── dialog ─────────────────────────────────────────────────────────────────

/**
 * The required average multiplier, or an honest dash.
 *
 * null means no stake has been recorded yet, which is different from zero —
 * zero would read as "already home" when in fact nothing is known.
 */
function breakEven() {
  const x = state.breakEvenMultiplier
  return x === null || x === undefined
    ? '<span class="text-on-surface-variant">—</span>'
    : `${x.toFixed(2)}x`
}

const BONUS_TYPES = [
  ['regular', 'Regular', 'Landed in normal play'],
  ['super', 'Super', 'Bought or super version'],
  ['five_scatter', '5 Scatter', 'Five-scatter trigger'],
]

/**
 * Asked at the moment of banking a bonus, because that is the one point where
 * the streamer knows both the bet they were on and how it triggered. The bet is
 * not optional book-keeping: the break-even multiplier is computed from the
 * stakes, so a bonus banked without one silently weakens the headline number.
 */
function collectDialog(entryId) {
  const entry = (state.entries ?? []).find((e) => e.id === entryId)
  const suggested = entry?.bet || detail.config?.defaultBet || ''

  const dialog = $('#dialog')
  dialog.innerHTML = `
    <div class="bg-surface-container rounded-xl border border-outline-variant shadow-xl max-w-md w-full p-xl relative overflow-hidden">
      <div class="absolute top-0 left-0 w-full h-1 bg-primary"></div>
      <h2 class="font-display-lg-mobile text-display-lg-mobile font-bold mb-base">Bank this bonus</h2>
      <p class="text-on-surface-variant mb-lg">${escapeHtml(entry?.slotName ?? entry?.rawText ?? 'Slot')}</p>

      <label class="block font-label-caps text-label-caps text-on-surface-variant uppercase mb-xs">Base bet</label>
      <input id="collect-bet" type="number" step="0.01" min="0" value="${escapeHtml(String(suggested))}"
             class="input-dark w-full rounded-lg px-sm py-xs font-data-mono text-[18px] mb-lg" autocomplete="off">

      <label class="block font-label-caps text-label-caps text-on-surface-variant uppercase mb-xs">Bonus type</label>
      <div class="grid grid-cols-3 gap-xs mb-lg" id="collect-type">
        ${BONUS_TYPES.map(([value, label, hint], i) => `
          <button data-type="${value}" title="${escapeHtml(hint)}"
            class="type-btn px-sm py-sm rounded-lg border font-bold text-sm transition-colors
                   ${i === 0 ? 'border-primary bg-primary/20 text-primary' : 'border-outline-variant text-on-surface-variant hover:border-primary/50'}">
            ${label}</button>`).join('')}
      </div>

      <div class="flex gap-md justify-end">
        <button id="dlg-cancel" class="px-md py-sm rounded-lg font-bold text-on-surface-variant hover:bg-surface-variant
          transition-colors font-label-caps uppercase">Cancel</button>
        <button id="dlg-ok" class="bg-primary text-on-primary px-md py-sm rounded-lg font-bold font-label-caps uppercase">
          Bank it</button>
      </div>
    </div>`

  dialog.classList.remove('hidden')
  dialog.classList.add('flex')

  const BASE = 'type-btn px-sm py-sm rounded-lg border font-bold text-sm transition-colors'
  const SELECTED = `${BASE} border-primary bg-primary/20 text-primary`
  const UNSELECTED = `${BASE} border-outline-variant text-on-surface-variant hover:border-primary/50`

  let bonusType = 'regular'
  const paintTypes = () => {
    for (const button of dialog.querySelectorAll('.type-btn')) {
      button.className = button.dataset.type === bonusType ? SELECTED : UNSELECTED
    }
  }
  for (const button of dialog.querySelectorAll('.type-btn')) {
    button.onclick = () => { bonusType = button.dataset.type; paintTypes() }
  }
  paintTypes()

  const close = () => { dialog.classList.add('hidden'); dialog.classList.remove('flex') }
  $('#dlg-cancel').onclick = close
  $('#dlg-ok').onclick = async () => {
    const bet = Number($('#collect-bet').value)
    if (!Number.isFinite(bet) || bet < 0) return toast('Enter the base bet', 'error')
    await act('entry.markCollected', { entryId, bet, bonusType })
    close()
  }

  // Enter banks it; the streamer is mid-hunt and should not need the mouse.
  $('#collect-bet').onkeydown = (e) => { if (e.key === 'Enter') $('#dlg-ok').click() }
  setTimeout(() => $('#collect-bet')?.select(), 50)
}

function confirmDialog(title, body, onConfirm, { html = false } = {}) {
  const dialog = $('#dialog')
  dialog.innerHTML = `
    <div class="bg-surface-container rounded-xl border border-outline-variant shadow-xl max-w-md w-full p-xl relative overflow-hidden">
      <div class="absolute top-0 left-0 w-full h-1 bg-primary"></div>
      <h2 class="font-display-lg-mobile text-display-lg-mobile font-bold mb-sm">${escapeHtml(title)}</h2>
      <div class="text-on-surface-variant mb-lg">${html ? body : escapeHtml(body)}</div>
      <div class="flex gap-md justify-end">
        <button id="dlg-cancel" class="px-md py-sm rounded-lg font-bold text-on-surface-variant hover:bg-surface-variant
          transition-colors font-label-caps uppercase">Cancel</button>
        <button id="dlg-ok" class="bg-primary text-on-primary px-md py-sm rounded-lg font-bold font-label-caps uppercase">
          Confirm</button>
      </div>
    </div>`
  dialog.classList.remove('hidden')
  dialog.classList.add('flex')

  const close = () => { dialog.classList.add('hidden'); dialog.classList.remove('flex') }
  $('#dlg-cancel').onclick = close
  $('#dlg-ok').onclick = async () => { await onConfirm(); close() }
  setTimeout(() => dialog.querySelector('input')?.focus(), 50)
}

// §20 — the unresolved queue is worked in bursts, so it gets real shortcuts.
document.addEventListener('keydown', (e) => {
  if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return
  const card = document.querySelector('[data-unresolved]')
  if (!card) return

  if (['1', '2', '3'].includes(e.key)) {
    card.querySelectorAll('[data-resolve]')[Number(e.key) - 1]?.click()
  } else if (e.key.toLowerCase() === 'd') {
    card.querySelector('[data-discard]')?.click()
  }
})
</script>
</body>
</html>
