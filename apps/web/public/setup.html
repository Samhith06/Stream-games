<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Set up · StreamArena</title>
<link href="/tailwind.css" rel="stylesheet"/>
<script src="/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  .input-dark { background:rgb(var(--surface-container-lowest)); border:1px solid rgb(var(--outline-variant)); color:rgb(var(--on-surface)); transition:all .2s ease; }
  .input-dark:focus { border-color:rgb(var(--tertiary)); box-shadow:0 0 0 1px rgb(var(--tertiary)), inset 0 0 8px rgb(var(--tertiary)/.2); outline:none; }
  .card-glass { background:rgb(var(--surface-container)/.7); backdrop-filter:blur(12px); border:1px solid rgb(var(--outline-variant)); box-shadow:0 8px 32px rgba(0,0,0,.5); }
  .seg:checked + label { background:rgb(var(--outline-variant)); color:rgb(var(--on-surface)); border-color:rgb(var(--outline)); }
  input[type=range]{-webkit-appearance:none;width:100%;background:transparent}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:16px;width:16px;border-radius:50%;
    background:rgb(var(--tertiary));cursor:pointer;margin-top:-6px;box-shadow:0 0 10px rgb(var(--tertiary))}
  input[type=range]::-webkit-slider-runnable-track{width:100%;height:4px;background:rgb(var(--outline-variant));border-radius:2px}
</style>
</head>
<body class="bg-background text-on-surface font-body-md antialiased flex">
<main class="flex-1 ml-64 min-h-screen">
  <div class="p-lg max-w-[1500px] mx-auto">
    <header class="mb-xl flex items-end justify-between">
      <div>
        <h1 class="font-display-lg-mobile text-display-lg-mobile font-black" id="title">Setup</h1>
        <p class="font-body-lg text-on-surface-variant mt-xs" id="subtitle">Configure your next session.</p>
      </div>
      <a href="/games" class="text-on-surface-variant hover:text-on-surface font-data-mono text-sm flex items-center gap-xs">
        <span class="material-symbols-outlined text-[18px]">arrow_back</span> Back
      </a>
    </header>

    <form id="form" class="grid grid-cols-1 lg:grid-cols-12 gap-xl">
      <div class="lg:col-span-7 space-y-lg pb-xl" id="fields"></div>

      <div class="lg:col-span-5">
        <div class="sticky top-6 bg-surface-container-lowest border border-outline-variant rounded-xl p-lg shadow-xl">
          <h3 class="font-headline-md text-headline-md mb-md">Summary</h3>
          <ul class="space-y-sm text-sm border-b border-outline-variant pb-md mb-md" id="summary"></ul>

          <p class="text-[13px] text-on-surface-variant leading-relaxed mb-md">
            You'll get the OBS overlay URL as soon as the session starts.
          </p>

          <button type="submit" id="submit"
            class="w-full bg-primary text-on-primary font-display-lg-mobile text-[22px] font-black py-md rounded-lg
                   uppercase tracking-tight flex items-center justify-center gap-sm
                   shadow-[0_0_15px_rgb(var(--primary)/.3)] hover:shadow-[0_0_25px_rgb(var(--primary)/.6)]
                   transition-all disabled:opacity-40 disabled:cursor-not-allowed">
            <span class="material-symbols-outlined text-[26px]" style="font-variation-settings:'FILL' 1">play_arrow</span>
            <span id="submit-label">Start</span>
          </button>
        </div>
      </div>
    </form>
  </div>
</main>

<!-- Modal host, same contract as the session page: hidden until something
     fills it, then switched to flex. -->
<div id="dialog" class="hidden fixed inset-0 bg-background/80 backdrop-blur-sm z-50 items-center justify-center p-md"></div>
<script type="module">
import { api, attempt, toast, money, $, escapeHtml } from './app.js'
import { mountShell, gameName } from './shell.js'

const gameId = new URLSearchParams(location.search).get('game') ?? 'bonus-hunt'
const me = await mountShell({ active: '/games' })
if (!me) throw new Error('unauthorized')

// Tournaments wear the indigo palette, everything else purple. After the
// shell, so its live-session guess doesn't win over the game we're setting up.
setGameTheme(gameId)

document.getElementById('title').textContent = `${gameName(gameId)} Setup`
document.getElementById('submit-label').textContent =
  gameId === 'bonus-hunt' ? 'Start Hunt' : 'Open Joining'

const saved = await api(`/api/games/${gameId}/config`)
const cfg = { ...saved.config }
const policy = { ...saved.chatPolicy }

const FIELDS =
  gameId === 'bonus-hunt'
    ? bonusHuntFields()
    : gameId === 'slot-bingo'
      ? bingoFields()
      : gameId === 'team-battles'
        ? battlesFields()
        : tournamentFields()
render()

function render() {
  $('#fields').innerHTML = FIELDS.map(section).join('')
  bind()
  summarise()
}

// ─── field definitions ──────────────────────────────────────────────────────

function bonusHuntFields() {
  return [
    { title: 'Hunt Profile', icon: 'account_balance_wallet', rows: [
      { k: 'startBalance', label: 'Starting balance', type: 'money', half: true },
      { k: 'targetBonuses', label: 'Target bonuses', type: 'int', half: true },
      { k: 'defaultBet', label: 'Default bet size', type: 'money', half: true },
      { k: 'currency', label: 'Currency', type: 'segment', half: true,
        options: [['EUR','EUR'],['USD','USD'],['GBP','GBP']] },
    ]},
    { title: 'Viewer Participation', icon: 'group_add', accent: 'secondary', rows: [
      { k: 'srGate', label: 'Who can add slots?', type: 'segment',
        options: [['anyone','Anyone'],['followers','Followers'],['subscribers','Subs'],['moderators','Only me']] },
      { k: 'oneEntryPerViewer', label: 'One slot per viewer for the whole hunt', type: 'toggle',
        hint: 'Off (recommended): a viewer may request again once you have banked or dropped their last slot — better for smaller channels. On: one slot each, whatever happens.' },
      { k: 'maxEntriesPerViewer', label: 'Slots a viewer may hold at once', type: 'stepper', half: true },
      { k: 'requestCooldownMs', label: 'Cooldown between requests', type: 'seconds', half: true, max: 120 },
    ]},
    { title: 'Guess the Balance', icon: 'psychology', rows: [
      { k: 'guessEnabled', label: 'Run Guess the Balance', type: 'toggle',
        hint: 'Viewers guess the final balance once the list is locked. Turn off for a plain hunt.' },
      { k: 'guessWindowMs', label: 'Guessing window', type: 'minutes', max: 10 },
      { k: 'guessCeilingMultiple', label: 'Reject guesses above this multiple of the balance', type: 'int', half: true },
    ]},
    { title: 'Bot & Chat', icon: 'smart_toy', rows: chatRows() },
  ]
}

function bingoFields() {
  return [
    { title: 'Board', icon: 'grid_on', rows: [
      { k: 'size', label: 'Board size', type: 'segment', options: [[3,'3 × 3'],[5,'5 × 5']] },
      { note: 'A 5×5 is 25 bonus buys and a full-session commitment — the estimate below is what it costs to fill. A 3×3 is nine, and finishes inside an hour.' },
      { k: 'openSquares', label: 'Squares held back for late joiners', type: 'stepper', half: true,
        hint: 'They sit visibly empty and unlock spread across the board, each by its own mini-draw. Set to 0 to close the board after the opening window — on a session that runs for hours, that is a locked door to everyone who tunes in late.' },
      { k: 'typicalBuy', label: 'Your typical bonus buy', type: 'money', half: true },
      { k: 'currency', label: 'Currency', type: 'segment', half: true,
        options: [['EUR','EUR'],['USD','USD'],['GBP','GBP']] },
      { k: 'freeCentre', label: 'Free centre square (5×5)', type: 'toggle',
        hint: 'An automatic green nobody owns. The four lines through the centre then need four greens instead of five, which roughly doubles the odds of an instant bingo — about 5% to about 8%.' },
    ]},

    { title: 'Scoring', icon: 'analytics', accent: 'secondary', rows: [
      { k: 'greenThresholdX', label: 'A square turns green at', type: 'multi', half: true, step: 0.1 },
      { k: 'bigWinThresholdX', label: 'Gold at', type: 'multi', half: true, step: 5 },
      { note: 'Green is profit and counts toward a line. Gold is a louder green — cosmetic to the rules, but it carries enormous weight in best-line scoring. Raising the green threshold makes greens rarer and an instant bingo close to impossible.' },
      { note: 'If no line goes fully green, the line with the highest combined multiplier wins. Ties break on combined payout, then green count, then lowest cost, then a seeded coin flip — and the board always says on screen which one decided it.' },
    ]},

    { title: 'Joining', icon: 'group_add', rows: [
      { k: 'joinGate', label: 'Who can join?', type: 'segment',
        options: [['anyone','Anyone'],['followers','Followers'],['subscribers','Subscribers']] },
      { k: 'joinWindowMs', label: 'Opening window', type: 'minutes', max: 15, nullable: true,
        nullLabel: 'No time limit (close it manually)' },
      { k: 'uniqueSlots', label: 'One viewer per slot', type: 'toggle',
        hint: 'First come, first served. A viewer whose pick is already taken is told in chat so they can choose again.' },
      { note: 'Joining does not close when the window does — it stays open until the last held-back square is claimed, so a viewer arriving at pick 14 can still get in.' },
    ]},

    { title: 'During the board', icon: 'play_circle', rows: [
      { k: 'allowManualPick', label: 'Allow playing a square out of order', type: 'toggle',
        hint: 'For a viewer who just subbed, or to build a moment. It is badged Streamer’s pick on the square and in the log.' },
      { k: 'allowSettleEarly', label: 'Allow settling the board early', type: 'toggle',
        hint: 'Ends where it stands and awards the best line among fully-played lines only. Announced as settled early, never silently.' },
      { k: 'announceDraw', label: 'Announce the draw in chat', type: 'toggle' },
    ]},

    { title: 'Bot & Chat', icon: 'smart_toy', rows: chatRows() },
  ]
}

function tournamentFields() {
  return [
    { title: 'Format', icon: 'view_comfy_alt', rows: [
      { k: 'seats', label: 'Available seats', type: 'segment', options: [[8,'8'],[12,'12'],[16,'16']] },
      { note: 'Winner is the higher multiplier — payout ÷ buy cost. €100 paying €425 is 4.25x, which beats €200 paying €610 at 3.05x.' },
    ]},
    { title: 'Joining', icon: 'group_add', accent: 'secondary', rows: [
      { k: 'joinGate', label: 'Who can join?', type: 'segment',
        options: [['anyone','Anyone'],['followers','Followers'],['subscribers','Subscribers']] },
      { k: 'joinWindowMs', label: 'Joining window', type: 'minutes', max: 15, nullable: true,
        nullLabel: 'No time limit (close it manually)' },
      { note: 'Slots are unique — first come, first served. A viewer whose pick is already taken is told in chat so they can choose again.' },
    ]},
    { title: 'Predictions', icon: 'online_prediction', rows: [
      { k: 'votingWindowMs', label: 'Voting window', type: 'seconds', max: 180 },
      { k: 'announceDraw', label: 'Announce the bracket in chat', type: 'toggle' },
    ]},
    { title: 'Bot & Chat', icon: 'smart_toy', rows: chatRows() },
  ]
}

function chatRows() {
  return [
    { k: 'ackMode', label: 'Bot replies', type: 'segment', policy: true,
      options: [['off','Off'],['errors','Errors only'],['batched','Batched'],['all','Every request']],
      hint: 'Errors only is the default. Success is already visible on the overlay, and acking 300 requests would flood chat and hit Kick\'s rate limit.' },
    { k: 'announceResults', label: 'Announce winners in chat', type: 'toggle', policy: true },
    { k: 'streamDelayMs', label: 'Stream delay', type: 'seconds', max: 60, policy: true,
      hint: 'How many seconds behind is your stream? We hold chat announcements this long so they do not spoil your overlay reveal.' },
  ]
}

// ─── rendering ──────────────────────────────────────────────────────────────

function section(sec) {
  return `
  <section class="card-glass rounded-xl p-lg ${sec.accent === 'secondary' ? 'border-t-2 border-t-secondary/50' : ''}">
    <div class="flex items-center gap-sm mb-lg border-b border-outline-variant pb-sm">
      <span class="material-symbols-outlined text-primary">${sec.icon}</span>
      <h2 class="font-headline-md text-headline-md">${sec.title}</h2>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-md">
      ${sec.rows.map(row).join('')}
    </div>
  </section>`
}

function row(f) {
  if (f.note) {
    return `<div class="md:col-span-2 bg-surface-container border-l-4 border-primary rounded-r-lg p-sm
                        text-[13px] text-on-surface-variant leading-relaxed">${escapeHtml(f.note)}</div>`
  }
  /*
   * A caveat the streamer has to see while choosing, not afterwards — Team
   * Battles §15 is explicit that the total-metric warning must sit next to the
   * control rather than in documentation. Gold rather than red: this is a
   * legitimate choice with a consequence, not an error.
   */
  if (f.warn) {
    return `<div class="md:col-span-2 bg-gold/10 border-l-4 border-gold rounded-r-lg p-sm
                        text-[13px] text-on-surface leading-relaxed flex gap-sm">
        <span class="material-symbols-outlined text-gold text-[18px] shrink-0">warning</span>
        <span>${escapeHtml(f.warn)}</span>
      </div>`
  }

  const value = f.policy ? policy[f.k] : cfg[f.k]
  const span = f.half ? '' : 'md:col-span-2'
  const hint = f.hint
    ? `<p class="text-[12px] text-on-surface-variant/70 mt-xs leading-relaxed">${escapeHtml(f.hint)}</p>`
    : ''
  const label = `<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase mb-xs">${escapeHtml(f.label)}</label>`

  let field = ''
  switch (f.type) {
    case 'money':
      field = `<input data-k="${f.k}" data-t="money" type="number" step="0.01" value="${value ?? 0}"
                 class="input-dark w-full rounded px-md py-sm font-data-mono h-12">`
      break
    case 'int':
      field = `<input data-k="${f.k}" data-t="int" type="number" value="${value ?? 0}"
                 class="input-dark w-full rounded px-md py-sm font-data-mono h-12">`
      break
    case 'multi':
      field = `<div class="relative">
          <input data-k="${f.k}" data-t="money" type="number" step="${f.step ?? 0.01}" min="0" value="${value ?? 0}"
            class="input-dark w-full rounded px-md py-sm pr-10 font-data-mono h-12">
          <span class="absolute right-md top-1/2 -translate-y-1/2 font-data-mono text-on-surface-variant">x</span>
        </div>`
      break
    case 'stepper':
      field = `<div class="flex items-center">
          <button type="button" data-step="-1" data-k="${f.k}" class="bg-surface-container-low border border-outline-variant
            hover:border-secondary w-12 h-12 rounded-l flex items-center justify-center">
            <span class="material-symbols-outlined">remove</span></button>
          <input data-k="${f.k}" data-t="int" readonly value="${value ?? 1}"
            class="input-dark w-full text-center h-12 rounded-none border-x-0 font-data-mono">
          <button type="button" data-step="1" data-k="${f.k}" class="bg-surface-container-low border border-outline-variant
            hover:border-secondary w-12 h-12 rounded-r flex items-center justify-center">
            <span class="material-symbols-outlined">add</span></button>
        </div>`
      break
    case 'seconds':
    case 'minutes': {
      const div = f.type === 'seconds' ? 1000 : 60000
      const unit = f.type === 'seconds' ? 's' : 'm'
      const isNull = value === null || value === undefined
      const shown = isNull ? Math.round((f.max ?? 5) / 2) : Math.round(value / div)
      field = `
        <div class="flex justify-between items-center mb-xs">
          <span></span><span class="font-data-mono text-secondary" data-out="${f.k}">${shown}${unit}</span>
        </div>
        <input data-k="${f.k}" data-t="${f.type}" data-div="${div}" data-unit="${unit}" type="range"
               min="1" max="${f.max ?? 10}" value="${shown}" ${isNull ? 'disabled' : ''} class="w-full">
        ${
          f.nullable
            ? `<label class="flex items-center gap-sm mt-sm cursor-pointer w-max">
                 <input type="checkbox" data-null="${f.k}" ${isNull ? 'checked' : ''}
                        class="w-5 h-5 rounded border-outline-variant bg-surface-container-lowest text-primary">
                 <span class="text-sm">${escapeHtml(f.nullLabel)}</span>
               </label>`
            : ''
        }`
      break
    }
    case 'segment':
      field = `<div class="flex flex-wrap gap-xs bg-surface-container-lowest p-1 rounded-lg border border-outline-variant">
        ${f.options.map(([v, text], i) => `
          <div class="flex-1">
            <input class="hidden seg" type="radio" name="${f.k}" id="${f.k}-${i}"
                   data-k="${f.k}" data-t="segment" value="${v}" ${String(value) === String(v) ? 'checked' : ''}>
            <label for="${f.k}-${i}" class="block text-center py-xs px-sm rounded-md text-sm font-medium
                   text-on-surface-variant hover:text-on-surface cursor-pointer transition-colors border border-transparent">
              ${escapeHtml(text)}</label>
          </div>`).join('')}
      </div>`
      break
    case 'toggle':
      return `<div class="${span}">
        <div class="flex items-center justify-between p-sm bg-surface-container-low rounded-lg border border-outline-variant/50">
          <span class="font-body-md">${escapeHtml(f.label)}</span>
          <button type="button" role="switch" data-k="${f.k}" data-t="toggle" aria-checked="${Boolean(value)}"
            class="relative inline-flex h-6 w-11 shrink-0 rounded-full border-2 border-transparent transition-colors
                   ${value ? 'bg-primary' : 'bg-surface-variant'}">
            <span class="pointer-events-none inline-block h-5 w-5 rounded-full bg-surface-container-lowest shadow
                         transition ${value ? 'translate-x-5' : 'translate-x-0'}"></span>
          </button>
        </div>${hint}</div>`
  }

  return `<div class="${span}">${label}${field}${hint}</div>`
}

// ─── binding ────────────────────────────────────────────────────────────────

function set(key, value, isPolicy) {
  if (isPolicy) policy[key] = value
  else cfg[key] = value
  summarise()
}

function isPolicyKey(k) {
  return ['ackMode', 'announceResults', 'streamDelayMs'].includes(k)
}

function bind() {
  for (const el of document.querySelectorAll('[data-k]')) {
    const k = el.dataset.k
    const t = el.dataset.t

    if (t === 'toggle') {
      el.addEventListener('click', () => {
        const next = el.getAttribute('aria-checked') !== 'true'
        el.setAttribute('aria-checked', String(next))
        el.classList.toggle('bg-primary', next)
        el.classList.toggle('bg-surface-variant', !next)
        el.firstElementChild.classList.toggle('translate-x-5', next)
        el.firstElementChild.classList.toggle('translate-x-0', !next)
        set(k, next, isPolicyKey(k))
      })
    } else if (t === 'segment') {
      el.addEventListener('change', () => {
        const raw = el.value
        set(k, /^\d+$/.test(raw) ? Number(raw) : raw, isPolicyKey(k))
      })
    } else if (t === 'seconds' || t === 'minutes') {
      const div = Number(el.dataset.div)
      el.addEventListener('input', () => {
        document.querySelector(`[data-out="${k}"]`).textContent = el.value + el.dataset.unit
        set(k, Number(el.value) * div, isPolicyKey(k))
      })
    } else if (t === 'money' || t === 'int') {
      el.addEventListener('input', () => set(k, Number(el.value), isPolicyKey(k)))
    }
  }

  for (const btn of document.querySelectorAll('[data-step]')) {
    btn.addEventListener('click', () => {
      const k = btn.dataset.k
      const input = document.querySelector(`input[data-k="${k}"]`)
      const next = Math.max(1, Math.min(10, Number(input.value) + Number(btn.dataset.step)))
      input.value = next
      set(k, next, false)
    })
  }

  for (const box of document.querySelectorAll('[data-null]')) {
    box.addEventListener('change', () => {
      const k = box.dataset.null
      const range = document.querySelector(`input[data-k="${k}"]`)
      range.disabled = box.checked
      set(k, box.checked ? null : Number(range.value) * Number(range.dataset.div), false)
    })
  }
}

/**
 * §11 — "the config screen must show projected spend".
 *
 * `25 squares × your typical buy` is a number the streamer needs before they
 * start, not after square 14. A 5×5 is a full-session commitment and the
 * summary says so in money rather than leaving it to be discovered live.
 */
function bingoSummary() {
  const size = cfg.size ?? 5
  const squares = size * size
  const lines = size * 2 + 2
  const buy = Number(cfg.typicalBuy ?? 0)
  const currency = cfg.currency ?? 'EUR'

  return [
    ['Board', `${size} × ${size} · ${squares} squares · ${lines} lines`],
    ['Full board costs', `≈ ${money(squares * buy, currency)}`],
    ['Green / gold', `${Number(cfg.greenThresholdX ?? 1).toFixed(2)}x / ${cfg.bigWinThresholdX ?? 50}x`],
    ['Held back', `${cfg.openSquares ?? 0} ${(cfg.openSquares ?? 0) === 1 ? 'square' : 'squares'}`],
    ['Free centre', cfg.freeCentre ? 'On' : 'Off'],
    ['Who can join', label(cfg.joinGate)],
    ['Opening window', cfg.joinWindowMs === null ? 'Manual close' : `${Math.round(cfg.joinWindowMs / 60000)} minutes`],
  ]
}

function battlesFields() {
  return [
    { title: 'Format', icon: 'settings_suggest', rows: [
      { k: 'maxPicks', label: 'Picks this session', type: 'segment',
        options: [[10,'10'],[15,'15'],[20,'20']] },
      { note: 'Declared before pick 1 and shown on the overlay throughout. A session that ends when the streamer decides can always be ended while their preferred team is ahead — a fixed count answers that before anyone makes the accusation.' },
      { k: 'winMetric', label: 'Win metric', type: 'segment',
        options: [['average','Average'],['total','Total'],['trimmed','Trimmed avg']] },
      { warn: 'Total: because the coin decides team sizes, the larger team wins roughly 80% of the time — the scoreboard stops measuring the slots and reports the flips instead. Average is size-independent, which is why it is the default.' },
      { k: 'drawMode', label: 'How teams are decided', type: 'segment',
        options: [['coin','Coin flip'],['bag','Balanced bag']] },
      { note: 'Balanced bag guarantees even teams by drawing from a fixed pool of chips. The cost is that the last pick of every session is predetermined — the most dramatic moment on the schedule, with no suspense left in it.' },
      { k: 'maxSuddenDeath', label: 'Sudden-death picks', type: 'stepper', half: true,
        hint: 'If the teams are close when the last scheduled pick lands, extra picks run automatically — up to this many, then the tiebreak decides. Set to 0 to turn it off.' },
      { k: 'typicalBuy', label: 'Your typical buy', type: 'money', half: true,
        hint: 'Not a game rule — it is what the projected spend is calculated from.' },
    ]},

    { title: 'Teams', icon: 'groups', rows: [
      { k: 'teamPreset', label: 'Teams', type: 'segment',
        options: [['chaos-fortune','Chaos / Fortune'],['blaze-frost','Blaze / Frost'],
                  ['kraken-phoenix','Kraken / Phoenix'],['high-low','High / Low']] },
      { note: 'Every preset is colour-checked: the two colours stay apart on a monochrome capture, on a badly calibrated monitor, and to a viewer with any form of colour blindness. The overlay is two colours telling you who is winning, so this is not decoration.' },
    ]},

    { title: 'Joining', icon: 'group_add', rows: [
      { k: 'joinGate', label: 'Who can enter?', type: 'segment',
        options: [['anyone','Anyone'],['followers','Followers'],['subscribers','Subs']] },
      { k: 'joinWindowMs', label: 'Opening window', type: 'minutes', max: 30 },
      { note: 'The window is the countdown before pick 1 only. Joining never closes after it — a viewer arriving at pick 9 of 15 can still enter and still be drawn, which is also what stops an empty pool from ending the session.' },
      { k: 'uniqueSlots', label: 'One viewer per slot', type: 'toggle',
        hint: 'First come, first served. The second request for a slot is rejected in chat rather than silently dropped.' },
    ]},

    { title: 'Picking a side', icon: 'diversity_3', rows: [
      { k: 'sideGate', label: 'Who can declare a side?', type: 'segment',
        options: [['anyone','Anyone'],['followers','Followers'],['subscribers','Subs']] },
      { note: 'Anyone in chat can back a team, drawn or not. A declaration is permanent for the session — allegiance that can switch is not allegiance, and the reward at the end becomes a prize for correct timing. Sides lock at the halfway pick so nobody reads the scoreboard late and piles onto the winner.' },
    ]},

    { title: 'Which slots can be entered', icon: 'policy', rows: [
      { note: 'A bad entry here is not a personal loss — the multiplier is banked to a team of a dozen people who had no say in it. These guards run at !join time, so a rejection reaches the viewer who typed it.' },
      { k: 'minBuyX', label: 'Cheapest buy allowed', type: 'multi', half: true, step: 1 },
      { k: 'maxBuyX', label: 'Priciest buy allowed', type: 'multi', half: true, step: 1 },
      { note: 'Bounded both ways on purpose. A floor alone invites the opposite exploit — entering the most expensive buy available so you cost the streamer the most. With a range, per-pick exposure is known before the session starts, which is what makes the estimate honest.' },
      { k: 'allowUnknownBuyCost', label: 'Allow slots with no buy price on file', type: 'toggle',
        hint: 'On by default. Most of the catalog has no buy data yet, so turning this off will reject almost every entry unless you have curated your own list.' },
    ]},

    { title: 'Overlay & awards', icon: 'tv', rows: [
      { k: 'publishFlipHash', label: 'Publish the flip commitment', type: 'toggle',
        hint: 'Posts a fingerprint of the committed flip sequence at the start and the sequence itself at the end. Anyone who cares can check the flips were decided before the first !join landed.' },
      { k: 'showAnchor', label: 'Award the Anchor', type: 'toggle',
        hint: 'The lowest multiplier of the session, named with affection. Never a penalty.' },
      { k: 'announceLeadChange', label: 'Announce lead changes in chat', type: 'toggle',
        hint: 'Held behind the stream delay, so it cannot spoil a flip viewers are still watching.' },
    ]},

    { title: 'Bot & Chat', icon: 'smart_toy', rows: chatRows() },
  ]
}

/*
 * A function, not a const object.
 *
 * `render()` runs near the top of this module and reaches this through
 * summarise() -> battlesSummary(). A `const` declared further down is still in
 * its temporal dead zone at that point, so the module threw before the submit
 * listener was attached — and the Open Joining button fell back to a native
 * form GET, which drops the ?game query and reloads the setup screen as Bonus
 * Hunt. Function declarations hoist, so this cannot happen again.
 */
function teamLabel(preset) {
  return (
    {
      'chaos-fortune': 'Chaos vs Fortune',
      'blaze-frost': 'Blaze vs Frost',
      'kraken-phoenix': 'Kraken vs Phoenix',
      'high-low': 'High vs Low',
    }[preset] ?? 'Custom'
  )
}

/**
 * §9.1 — projected spend, recomputed live as the pick count moves.
 *
 * Fifteen picks at a €200 buy is €3,000 committed before the first name is
 * drawn, and a streamer picking 20 because it sounds fun should watch that
 * number double while they do it.
 */
function battlesSummary() {
  const picks = cfg.maxPicks ?? 10
  const buy = cfg.typicalBuy ?? 200
  const currency = cfg.currency ?? 'EUR'
  // ~4.5 minutes a pick, which is what the spec's session-length table implies.
  const minutes = Math.round(picks * 4.5)

  return [
    ['Format', `${picks} picks · ${label(cfg.winMetric ?? 'average')}`],
    ['Teams', teamLabel(cfg.teamPreset ?? 'chaos-fortune')],
    ['Flips decided by', (cfg.drawMode ?? 'coin') === 'bag' ? 'Balanced bag' : 'Coin flip'],
    ['Who can join', label(cfg.joinGate)],
    ['Buys accepted', `${cfg.minBuyX ?? 50}x – ${cfg.maxBuyX ?? 500}x`],
    ['Runs about', minutes >= 60 ? `${(minutes / 60).toFixed(1)} hours` : `${minutes} minutes`],
    ['Projected spend', `≈ ${money(picks * buy, currency)}`],
  ]
}

function summarise() {
  const rows = gameId === 'slot-bingo'
    ? bingoSummary()
    : gameId === 'team-battles'
    ? battlesSummary()
    : gameId === 'bonus-hunt'
    ? [
        ['Starting balance', `${cfg.currency ?? 'EUR'} ${(cfg.startBalance ?? 0).toLocaleString()}`],
        ['Target', `${cfg.targetBonuses ?? 0} bonuses`],
        ['Default bet', `${cfg.currency ?? 'EUR'} ${cfg.defaultBet ?? 0}`],
        ['Who can add', label(cfg.srGate)],
        ['Entry limit', cfg.oneEntryPerViewer
          ? `${cfg.maxEntriesPerViewer} for the whole hunt`
          : `${cfg.maxEntriesPerViewer} at a time`],
        ['Guess the Balance', cfg.guessEnabled ? `On · ${Math.round((cfg.guessWindowMs ?? 0) / 60000)}m` : 'Off'],
      ]
    : [
        ['Bracket', `${cfg.seats} seats`],
        ['Who can join', label(cfg.joinGate)],
        ['Joining', cfg.joinWindowMs === null ? 'Manual close' : `${Math.round(cfg.joinWindowMs / 60000)} minutes`],
        ['Voting', `${Math.round((cfg.votingWindowMs ?? 0) / 1000)} seconds`],
      ]

  rows.push(['Bot replies', label(policy.ackMode)])
  rows.push(['Stream delay', `${Math.round((policy.streamDelayMs ?? 0) / 1000)}s`])

  $('#summary').innerHTML = rows.map(([k, v]) => `
    <li class="flex justify-between items-center gap-md">
      <span class="text-on-surface-variant">${escapeHtml(k)}</span>
      <span class="font-data-mono text-on-surface text-right">${escapeHtml(v)}</span>
    </li>`).join('')
}

// A declaration, not a const arrow: summarise() runs from the first render(),
// which happens above this line.
function label(v) {
  return ({ anyone: 'Anyone', followers: 'Followers', subscribers: 'Subscribers',
    moderators: 'Only me', off: 'Off', errors: 'Errors only', batched: 'Batched',
    all: 'Every request' })[v] ?? v
}

// ─── submit ─────────────────────────────────────────────────────────────────

$('#form').addEventListener('submit', async (event) => {
  event.preventDefault()
  const button = $('#submit')
  button.disabled = true

  try {
    const session = await attempt(() =>
      api('/api/sessions', { method: 'POST', body: { gameId, config: cfg, chatPolicy: policy } }),
    )
    // Creating and starting are separate so a crash between them leaves a
    // session you can resume rather than a half-subscribed channel.
    await attempt(() => api(`/api/sessions/${session.id}/start`, { method: 'POST' }))
    location.href = `/session?id=${session.id}`
  } catch (err) {
    button.disabled = false
    if (err.code !== 'session_running') return

    /*
     * One session per channel (§6.3), so this is a real conflict rather than a
     * failure — but it used to flash a toast and then navigate to the running
     * session on a timer. From the streamer's side that looks like Open Joining
     * opened the wrong game: they clicked Team Battles and landed on a Bonus
     * Hunt. Name the game that is in the way and let them choose.
     */
    const running = gameName(err.details?.gameId ?? '') || 'A session'
    const sessionUrl = `/session?id=${err.details?.sessionId}`

    const dialog = $('#dialog')
    dialog.innerHTML = `
      <div class="bg-surface-container rounded-xl border border-outline-variant shadow-xl max-w-md w-full p-xl relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gold"></div>
        <h2 class="font-headline-md text-headline-md font-bold mb-base">${escapeHtml(running)} is still running</h2>
        <p class="text-on-surface-variant mb-lg leading-relaxed">
          Only one session can run on a channel at a time — chat commands would otherwise
          have two possible meanings. End the ${escapeHtml(running)} session first, then come
          back and open ${escapeHtml(gameName(gameId))}.
        </p>
        <div class="flex gap-md justify-end">
          <button id="dlg-stay" class="px-md py-sm rounded-lg font-bold text-on-surface-variant
            hover:bg-surface-variant transition-colors font-label-caps uppercase">Stay here</button>
          <a href="${sessionUrl}" class="bg-primary text-on-primary px-md py-sm rounded-lg font-bold
            font-label-caps uppercase flex items-center gap-xs">
            Go to ${escapeHtml(running)}
            <span class="material-symbols-outlined text-[18px]">arrow_forward</span></a>
        </div>
      </div>`

    dialog.classList.remove('hidden')
    dialog.classList.add('flex')
    $('#dlg-stay').onclick = () => {
      dialog.classList.add('hidden')
      dialog.classList.remove('flex')
    }
  }
})
</script>
</body>
</html>
