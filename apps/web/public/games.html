<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Game Catalog · StreamArena</title>
<link href="/tailwind.css" rel="stylesheet"/>
<script src="/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
</head>
<body class="bg-background text-on-surface font-body-md antialiased flex">
<main class="flex-1 ml-64 min-h-screen relative bg-background">
  <div class="max-w-7xl mx-auto pb-xl">
    <header class="pt-xl pb-lg px-lg">
      <h1 class="font-headline-md text-headline-md text-on-surface mb-xs">Choose a game</h1>
      <p class="font-body-md text-on-surface-variant">Pick a game to run with your chat. Setup takes less than a minute.</p>
    </header>

    <div id="warning" class="hidden mx-lg mb-lg p-md rounded-xl bg-error-container/25 border border-error/40 text-error"></div>

    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-gutter px-lg" id="grid">
      <div class="col-span-full text-on-surface-variant font-data-mono py-xl text-center">Loading…</div>
    </div>
  </div>
</main>

<script type="module">
import { api, toast, escapeHtml } from './app.js'
import { mountShell } from './shell.js'

const ICONS = { 'bonus-hunt': 'redeem', 'slot-tournament': 'swords', 'slot-bingo': 'grid_on',
  'team-battles': 'groups', giveaways: 'volunteer_activism',
                predictions: 'online_prediction', 'guess-the-multiplier': 'rocket_launch' }

const me = await mountShell({ active: '/games' })
if (me) {
  if (!me.kickConnected) {
    show('Your Kick account is disconnected. <a href="/auth/kick" class="underline font-bold">Reconnect</a> to run a game.')
  } else if (!me.channel) {
    show('We could not find your Kick channel. <a href="/auth/kick" class="underline font-bold">Sign in again</a> to fix it.')
  }

  const { games } = await api('/api/games')
  render(games, me.activeSession)
}

function show(html) {
  const box = document.getElementById('warning')
  box.innerHTML = html
  box.classList.remove('hidden')
}

function render(games, activeSession) {
  document.getElementById('grid').innerHTML = games.map((game) => {
    const icon = ICONS[game.id] ?? 'casino'

    if (game.status === 'coming_soon') {
      return `
      <div class="relative bg-surface-container rounded-xl overflow-hidden border border-outline-variant opacity-50 flex flex-col">
        <div class="absolute top-sm right-sm z-20 bg-surface-variant/80 backdrop-blur text-on-surface font-label-caps
                    text-[10px] px-2 py-1 rounded border border-outline-variant uppercase tracking-widest">Soon</div>
        <div class="aspect-[16/10] w-full bg-surface-container-highest flex items-center justify-center grayscale">
          <span class="material-symbols-outlined text-[64px] text-on-surface-variant" style="font-variation-settings:'FILL' 1">${icon}</span>
        </div>
        <div class="p-md flex flex-col flex-1">
          <h3 class="font-headline-md text-[20px] font-bold text-on-surface mb-sm">${escapeHtml(game.displayName)}</h3>
          <p class="font-body-md text-[14px] text-on-surface-variant">${escapeHtml(game.tagline)}</p>
        </div>
      </div>`
    }

    // §5 — one session per channel at a time, so the card says so rather than
    // letting the streamer click through to a 409.
    const busy = Boolean(activeSession)
    const commands = game.commands.map((c) => `!${escapeHtml(c.keyword)}`).join(' · ')

    return `
    <div class="group relative bg-surface-container rounded-xl overflow-hidden border border-outline-variant
                hover:border-primary hover:shadow-[0_0_20px_rgb(var(--primary)/0.15)] transition-all duration-300
                hover:-translate-y-1 flex flex-col">
      <div class="h-[2px] w-full bg-gradient-to-r from-primary to-secondary"></div>
      <div class="aspect-[16/10] w-full relative overflow-hidden bg-surface-container-high flex items-center justify-center">
        <div class="absolute inset-0 opacity-20 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))]
                    from-primary via-surface-container to-surface-container-high"></div>
        <span class="material-symbols-outlined text-[80px] text-primary relative z-10
                     drop-shadow-[0_0_15px_rgb(var(--primary)/0.4)] transform group-hover:scale-110 transition-transform duration-500"
              style="font-variation-settings:'FILL' 1">${icon}</span>
      </div>
      <div class="p-md flex flex-col flex-1 bg-surface-container">
        <div class="flex items-start justify-between mb-sm">
          <h3 class="font-headline-md text-[20px] font-bold text-on-surface leading-tight">${escapeHtml(game.displayName)}</h3>
          <span class="material-symbols-outlined text-secondary opacity-80" style="font-variation-settings:'FILL' 1">bolt</span>
        </div>
        <p class="font-body-md text-[14px] text-on-surface-variant mb-md">${escapeHtml(game.tagline)}</p>
        <div class="font-data-mono text-[11px] text-on-surface-variant/70 mb-md">${commands}</div>

        <div class="mt-auto">
          ${
            busy
              ? `<a href="/session?id=${activeSession.id}"
                    class="w-full block text-center bg-surface-variant text-on-surface-variant font-body-md font-bold py-sm rounded-lg">
                   A session is already running →
                 </a>`
              : `<a href="/setup?game=${game.id}"
                    class="w-full bg-primary hover:bg-primary-container text-on-primary font-body-lg font-bold py-sm rounded-lg
                           shadow-[0_0_15px_rgb(var(--primary)/0.2)] hover:shadow-[0_0_20px_rgb(var(--primary)/0.4)]
                           transition-all flex items-center justify-center gap-xs">
                   <span class="material-symbols-outlined text-[20px]">tune</span> Set up
                 </a>`
          }
        </div>
      </div>
    </div>`
  }).join('')
}
</script>
</body>
</html>
