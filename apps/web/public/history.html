<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>History · StreamArena</title>
<link href="/tailwind.css" rel="stylesheet"/>
<script src="/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
</head>
<body class="bg-background text-on-surface font-body-md antialiased flex">
<main class="flex-1 ml-64 min-h-screen">
  <div class="p-lg max-w-[1400px] mx-auto">
    <header class="mb-lg pb-sm border-b border-outline-variant/20 flex flex-wrap justify-between items-end gap-md">
      <div>
        <h2 class="font-display-lg text-display-lg">Session History</h2>
        <p class="font-body-md text-on-surface-variant mt-base">Review past sessions and how they went.</p>
      </div>
      <div class="flex gap-sm items-center">
        <select id="game" class="bg-surface-container border border-outline-variant/30 rounded py-xs px-sm font-data-mono text-sm">
          <option value="all">All games</option>
          <option value="bonus-hunt">Bonus Hunts</option>
          <option value="slot-tournament">Tournaments</option>
        </select>
        <div class="flex p-[2px] bg-surface-container-highest rounded border border-outline-variant/20" id="result">
          <button data-r="all" class="px-sm py-1 text-primary bg-primary/10 rounded font-label-caps text-label-caps">ALL</button>
          <button data-r="profit" class="px-sm py-1 text-on-surface-variant rounded font-label-caps text-label-caps">PROFIT</button>
          <button data-r="loss" class="px-sm py-1 text-on-surface-variant rounded font-label-caps text-label-caps">LOSS</button>
        </div>
      </div>
    </header>

    <section class="grid grid-cols-2 lg:grid-cols-4 gap-md mb-lg" id="summary"></section>
    <section class="flex flex-col gap-sm" id="list">
      <div class="text-on-surface-variant font-data-mono py-xl text-center">Loading…</div>
    </section>
  </div>
</main>

<script type="module">
import { api, money, signed, escapeHtml, $ } from './app.js'
import { mountShell, gameName } from './shell.js'

const me = await mountShell({ active: '/history' })
if (!me) throw new Error('unauthorized')

const filters = { gameId: 'all', result: 'all' }
await load()

$('#game').addEventListener('change', (e) => { filters.gameId = e.target.value; load() })

for (const button of document.querySelectorAll('#result button')) {
  button.addEventListener('click', () => {
    filters.result = button.dataset.r
    for (const other of document.querySelectorAll('#result button')) {
      const on = other === button
      other.className = `px-sm py-1 rounded font-label-caps text-label-caps ${
        on ? 'text-primary bg-primary/10' : 'text-on-surface-variant'}`
    }
    load()
  })
}

async function load() {
  const qs = new URLSearchParams({ gameId: filters.gameId, result: filters.result, limit: '50' })
  const { sessions, summary } = await api(`/api/sessions?${qs}`)

  $('#summary').innerHTML = [
    ['list_alt', 'Total sessions', String(summary.totalSessions), null],
    ['track_changes', 'Bonus hunts', String(summary.totalHunts), null],
    ['workspace_premium', 'Best result', summary.bestResult ? signed(summary.bestResult.profit) : '—', 'text-tertiary'],
    ['trending_up', 'Average result',
      summary.averageProfit === null ? '—' : signed(summary.averageProfit),
      summary.averageProfit === null ? null : summary.averageProfit >= 0 ? 'text-win' : 'text-error'],
  ].map(([icon, label, value, accent]) => `
    <div class="bg-surface-container rounded-lg p-md border ${accent === 'text-tertiary' ? 'border-tertiary/50' : 'border-outline-variant/10'}">
      <p class="font-label-caps text-label-caps ${accent ?? 'text-on-surface-variant'} mb-xs flex items-center gap-xs">
        <span class="material-symbols-outlined text-[16px]">${icon}</span> ${label.toUpperCase()}
      </p>
      <p class="font-headline-md text-headline-md ${accent ?? 'text-on-surface'}">${escapeHtml(value)}</p>
    </div>`).join('')

  $('#list').innerHTML = sessions.length === 0 ? empty() : sessions.map(card).join('')
}

const empty = () => `
  <div class="flex flex-col items-center py-xl bg-surface-container rounded-xl border border-outline-variant/10 text-center">
    <span class="material-symbols-outlined text-[80px] text-outline-variant opacity-50">sports_esports</span>
    <h3 class="font-display-lg-mobile text-display-lg-mobile mt-md mb-sm">No sessions yet</h3>
    <p class="text-on-surface-variant max-w-md mb-lg">Run your first game and it will show up here.</p>
    <a href="/games" class="bg-primary text-on-primary font-bold px-lg py-sm rounded">Start a game</a>
  </div>`

function card(s) {
  const profit = s.profit
  const good = (profit ?? 0) >= 0
  const border = profit === null ? 'border-l-outline-variant' : good ? 'border-l-win' : 'border-l-loss'
  const duration = s.durationMs
    ? `${Math.floor(s.durationMs / 3600000)}h ${Math.floor((s.durationMs % 3600000) / 60000)}m`
    : 'in progress'

  return `
  <a href="/session?id=${s.id}" class="bg-surface-container rounded-lg border-l-[3px] ${border} border-y border-r
     border-outline-variant/10 hover:-translate-y-[2px] transition-all block group shadow-lg shadow-black/20">
    <div class="p-md grid grid-cols-1 md:grid-cols-12 gap-md items-center">
      <div class="md:col-span-5 flex items-center gap-sm">
        <div class="w-12 h-12 rounded bg-surface border border-outline-variant/20 flex items-center justify-center shrink-0">
          <span class="material-symbols-outlined text-secondary">${s.gameId === 'bonus-hunt' ? 'casino' : 'swords'}</span>
        </div>
        <div>
          <h3 class="font-body-md font-bold group-hover:text-primary transition-colors">${escapeHtml(gameName(s.gameId))}</h3>
          <div class="flex items-center gap-xs text-on-surface-variant font-data-mono text-[12px] mt-[2px]">
            <span>${new Date(s.startedAt).toLocaleDateString()}</span><span>·</span>
            <span>${escapeHtml(duration)}</span><span>·</span>
            <span class="capitalize">${escapeHtml(s.status)}</span>
          </div>
        </div>
      </div>

      <div class="md:col-span-3 font-data-mono text-[13px] text-on-surface-variant">
        ${s.itemCount} ${s.gameId === 'bonus-hunt' ? 'bonuses' : 'entrants'} · ${s.participantCount} players
        ${s.bestSlot ? `<div class="mt-1 truncate">Best: ${escapeHtml(s.bestSlot.name)}</div>` : ''}
        ${s.champion ? `<div class="mt-1 truncate">Won by @${escapeHtml(s.champion.username)}</div>` : ''}
      </div>

      <div class="md:col-span-4 text-right">
        <p class="font-headline-md text-headline-md font-bold ${
          profit === null ? 'text-on-surface-variant' : good ? 'text-win' : 'text-loss'}">
          ${profit === null ? '—' : signed(profit)}</p>
        ${s.startBalance !== null
          ? `<p class="font-data-mono text-[12px] text-on-surface-variant/70">
               ${money(s.startBalance)} → ${money(s.finalBalance ?? s.startBalance)}</p>`
          : ''}
      </div>
    </div>
  </a>`
}
</script>
</body>
</html>
