services:
  postgres:
    image: postgres:16-alpine
    container_name: streamarena-pg
    environment:
      POSTGRES_USER: streamarena
      POSTGRES_PASSWORD: streamarena
      POSTGRES_DB: streamarena
    # Non-default host ports so StreamArena can share a machine with other
    # projects already holding 5432/6379.
    ports: ["55432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamarena"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: streamarena-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["56379:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
